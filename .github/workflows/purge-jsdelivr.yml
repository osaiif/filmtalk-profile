name: Purge jsDelivr Cache
on:
  push:
    branches: [main]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed files and purge jsDelivr
        run: |
          set -e

          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"

          # Figure out which files changed in this push.
          # On a brand-new branch (before = all zeros) or if the before
          # commit isn't reachable (e.g. force-push), fall back to just
          # the files touched in the latest commit so the job never fails.
          if [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable 'before' commit, diffing latest commit only."
            FILES=$(git diff-tree --no-commit-id --name-only -r "$AFTER")
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          if [ -z "$FILES" ]; then
            echo "No changed files detected, nothing to purge."
            exit 0
          fi

          echo "Changed files:"
          echo "$FILES"
          echo "---"

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            # URL-encode spaces etc. in the path (jsDelivr paths mirror the repo path)
            ENCODED_FILE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FILE")
            URL="https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/${ENCODED_FILE}"
            echo "Purging: $URL"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" "$URL" || true
          done <<< "$FILES"
