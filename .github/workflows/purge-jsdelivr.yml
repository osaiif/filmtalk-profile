name: Purge jsDelivr Cache
on:
  push:
    branches: [main]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed files and purge jsDelivr
        run: |
          set -e

          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"

          # Figure out which files changed in this push.
          # On a brand-new branch (before = all zeros) or if the before
          # commit isn't reachable (e.g. force-push), fall back to just
          # the files touched in the latest commit so the job never fails.
          if [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable 'before' commit, diffing latest commit only."
            FILES=$(git diff-tree --no-commit-id --name-only -r "$AFTER")
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          if [ -z "$FILES" ]; then
            echo "No changed files detected, nothing to purge."
            exit 0
          fi

          echo "Changed files:"
          echo "$FILES"
          echo "---"

          purge_and_warm() {
            local FILE="$1"
            local ENCODED_FILE
            ENCODED_FILE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FILE")
            local PURGE_URL="https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/${ENCODED_FILE}"
            local CDN_URL="https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/${ENCODED_FILE}"

            # jsDelivr's purge endpoint frequently needs to be hit twice to
            # actually evict the file from every edge node - a single call
            # often just "registers" the purge instead of completing it.
            echo "Purging (1/2): $PURGE_URL"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" "$PURGE_URL" || true

            sleep 5

            echo "Purging (2/2): $PURGE_URL"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" "$PURGE_URL" || true

            sleep 2

            # Warm the cache: the first GET after a purge is what makes
            # jsDelivr re-fetch the new file from GitHub and cache it.
            # Without this, some edges keep serving the old file until
            # someone else happens to request it first.
            echo "Warming: $CDN_URL"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" -H "Cache-Control: no-cache" "$CDN_URL" || true
          }

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            purge_and_warm "$FILE"
          done <<< "$FILES"
