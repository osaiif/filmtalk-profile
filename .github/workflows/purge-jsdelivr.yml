name: Purge jsDelivr Cache
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed files and purge jsDelivr
        run: |
          set -e

          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AFTER=$(git rev-parse HEAD)
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: purging every tracked file."
            FILES=$(git ls-tree -r "$AFTER" --name-only 2>/dev/null || git ls-files)
          elif [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable 'before' commit, diffing latest commit only."
            FILES=$(git diff-tree --no-commit-id --name-only -r "$AFTER")
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          if [ -z "$FILES" ]; then
            echo "No changed files detected, nothing to purge."
            exit 0
          fi

          echo "Changed files:"
          echo "$FILES"
          echo "---"

          purge_and_warm() {
            local FILE="$1"
            local ENCODED_FILE
            ENCODED_FILE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FILE")
            local PURGE_URL="https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/${ENCODED_FILE}"
            local CDN_URL="https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/${ENCODED_FILE}"

            echo "Purging: $PURGE_URL"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" "$PURGE_URL" || true

            sleep 2

            echo "Warming: $CDN_URL"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" -H "Cache-Control: no-cache" "$CDN_URL" || true
          }

          ROUND_MARKS=(0 60 300 900)
          PREV_MARK=0

          for MARK in "${ROUND_MARKS[@]}"; do
            SLEEP_FOR=$((MARK - PREV_MARK))
            if [ "$SLEEP_FOR" -gt 0 ]; then
              echo "Waiting ${SLEEP_FOR}s before next purge round..."
              sleep "$SLEEP_FOR"
            fi
            PREV_MARK=$MARK

            echo "=== Purge round at +${MARK}s ==="
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              purge_and_warm "$FILE"
            done <<< "$FILES"
          done
